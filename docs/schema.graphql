# Generado con `npm run schema` en src/backend/. No editar a mano.

input CrearParcelaInput {
  nombre: String

  """Polígono GeoJSON (longitud, latitud)."""
  poligono: GeoJSON

  """Usa punto o poligono, no ambos."""
  punto: PuntoInput
}

type Cultivo {
  """
  Código estable para filtros y preferencias, p. ej. "maiz"
  """
  codigo: String!
  familiaBotanica: String!
  id: ID!
  nombre: String!

  """false = los parámetros agronómicos aún no tienen fuente verificada"""
  verificado: Boolean!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type EscenarioGuardado {
  creadoEn: DateTime!
  id: ID!
  lluviaPct: Int!
  nombre: String
  parcelaId: ID!

  """Resultado calculado al guardar el escenario"""
  resultado: [RotacionEvaluada!]!
  tempDeltaC: Float!
}

input EscenarioInput {
  """Cambio de lluvia en %, de -100 a 100"""
  lluviaPct: Int!

  """Cambio de temperatura en °C, de -10 a 10"""
  tempDeltaC: Float!
}

type EstadoFuente {
  detalle: String
  estado: NivelEstado!

  """
  p. ej. "base de datos", "motor de reglas"
  """
  nombre: String!
}

type EstadoServicio {
  """true = usa fixtures en vez de APIs externas"""
  demoOffline: Boolean!
  entorno: String!
  estado: NivelEstado!
  fuentes: [EstadoFuente!]!
  version: String!
}

"""Geometría GeoJSON: Point o Polygon en WGS84 (longitud, latitud)."""
scalar GeoJSON

input GuardarEscenarioInput {
  lluviaPct: Int!
  nombre: String
  parcelaId: ID!
  tempDeltaC: Float!
}

type Mutation {
  """Crea una parcela a partir de un punto o de un polígono GeoJSON."""
  crearParcela(input: CrearParcelaInput!): Parcela!

  """Calcula y guarda un escenario de lluvia y temperatura."""
  guardarEscenario(input: GuardarEscenarioInput!): EscenarioGuardado!

  """Guarda (o reemplaza) las prioridades y restricciones de una parcela."""
  guardarPreferencias(input: PreferenciasInput!, parcelaId: ID!): Preferencias!
}

enum NivelEstado {
  DEGRADADO
  NO_DISPONIBLE
  OK
}

type Parcela {
  creadaEn: DateTime!

  """Forma de la parcela (Point o Polygon)"""
  geometria: GeoJSON!
  id: ID!

  """Latitud del centroide"""
  latitud: Float!

  """Longitud del centroide"""
  longitud: Float!
  nombre: String
  preferencias: Preferencias
}

type Preferencias {
  actualizadaEn: DateTime!

  """Agua de riego disponible por ciclo (mm)"""
  aguaRiegoMm: Float
  cultivosExcluidos: [String!]!

  """Códigos de cultivo (ver query cultivos)"""
  cultivosPreferidos: [String!]!
  id: ID!
  maquinaria: [String!]!
  parcelaId: ID!
  prioridad: Prioridad!

  """true = riego, false = temporal"""
  riego: Boolean!
}

input PreferenciasInput {
  aguaRiegoMm: Float
  cultivosExcluidos: [String!]
  cultivosPreferidos: [String!]
  maquinaria: [String!]
  prioridad: Prioridad = BALANCE
  riego: Boolean!
}

"""Qué le importa más al agricultor al elegir una rotación."""
enum Prioridad {
  AGUA
  BALANCE
  INGRESO
  SUELO
}

type Puntajes {
  agua: Float!
  global: Float!
  riesgo: Float!
  suelo: Float!
}

input PuntoInput {
  latitud: Float!
  longitud: Float!
}

type Query {
  """Catálogo de cultivos disponibles."""
  cultivos: [Cultivo!]!

  """Escenarios guardados de una parcela (los 50 más recientes)."""
  escenarios(parcelaId: ID!): [EscenarioGuardado!]!

  """Una parcela por su id (null si no existe)."""
  parcela(id: ID!): Parcela

  """Las 3 mejores rotaciones a 3 años para una parcela."""
  recomendaciones(input: RecomendacionInput!): [RotacionEvaluada!]!

  """Estado del servidor y de cada pieza de la que depende."""
  salud: EstadoServicio!

  """Recalcula con otro escenario de lluvia y temperatura sin guardar."""
  simularEscenario(input: SimulacionInput!): [RotacionEvaluada!]!
}

input RecomendacionInput {
  """Sin escenario = condiciones normales"""
  escenario: EscenarioInput
  parcelaId: ID!
}

type RotacionEvaluada {
  """Cultivo de cada uno de los 3 años (códigos)"""
  anios: [String!]!

  """Dónde importa el criterio del agricultor o del técnico"""
  criterioHumano: [String!]!

  """Por qué conviene, en lenguaje sencillo"""
  explicacion: String!
  puntajes: Puntajes!
  semaforos: Semaforos!
}

"""Verde ≥ 70, amarillo 40–69, rojo < 40."""
enum Semaforo {
  AMARILLO
  ROJO
  VERDE
}

type Semaforos {
  agua: Semaforo!
  global: Semaforo!
  riesgo: Semaforo!
  suelo: Semaforo!
}

input SimulacionInput {
  escenario: EscenarioInput!
  parcelaId: ID!
}
