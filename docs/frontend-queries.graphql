# Operaciones GraphQL para el frontend (reemplazan a src/data/index.ts de la rama `frontend`).
# Cada operación indica a qué tipo de src/data/types.ts corresponde. Esquema completo: schema.graphql.

# ---- Parcelas (Field, PlotRecord) ----
query Parcelas {
  parcelas(limite: 50) {
    id version nombre descripcion cultivoActual areaHa latitud longitud geometria
    preferencias {
      sistemaRiego aguaRiegoMm tipoSuelo mesesVaciosDesde mesesVaciosHasta maquinaria
      cultivosPreferidos cultivosExcluidos prioridades { agua suelo erosion ingreso }
    }
    historial { anio cultivo fechaSiembra descripcion }
  }
}

# El formulario "Add a field": todo o nada. claveIdempotencia = un id nuevo por intento del usuario.
mutation CrearParcela($input: CrearParcelaInput!) {
  crearParcela(input: $input) { id version areaHa }
}

mutation ActualizarParcela($id: ID!, $input: ActualizarParcelaInput!) {
  actualizarParcela(id: $id, input: $input) { id version }
}

mutation EliminarParcela($id: ID!, $version: Int!) {
  eliminarParcela(id: $id, version: $version)
}

mutation GuardarHistorial($parcelaId: ID!, $input: HistorialInput!) {
  guardarHistorial(parcelaId: $parcelaId, input: $input) { anio cultivo fechaSiembra descripcion }
}

# ---- Capas del mapa con los sliders (GridLayer) ----
query Capa($tipo: TipoCapa!, $escenario: EscenarioInput) {
  capa(tipo: $tipo, escenario: $escenario) {
    tipo titulo variable unidad min max leyenda fuente resolucionM interpolada datosAl notas
    rampa { en color }
    rejilla { bbox columnas filas valores }
    escenario { lluviaPct tempDeltaC aplica interpolado recortado }
  }
}

# ---- Puntos y alertas (MapPoint, AlertSummary) ----
query PuntosDeEstres($caja: CajaInput) {
  puntos(tipo: ESTRES, caja: $caja) {
    datosAl notas unidad
    puntos { id latitud longitud severidad valor etiqueta }
  }
}

query Alertas {
  alertas { tipo titulo valor unidad detalle definicion datosAl }
}

# ---- Resúmenes (HumiditySummary, ClimatePrediction) ----
query Resumenes {
  resumenHumedad { raiz superficie evaporacion percentil datosAl fuente }
  resumenClima {
    lluviaMananaPct lluviaMensualMm olaDeCalor7DiasPct
    temperaturaMaxC temperaturaMinC temperaturaMediaC datosAl notas
  }
}

# ---- Gráficas (mercado y estadísticas campo vs región) ----
query SeriesDeMercado { series(prefijo: "market:") { clave titulo unidad fuente notas puntos { etiqueta a pronostico } } }
query Estadisticas { series(prefijo: "statistics:") { clave titulo unidad etiquetaA etiquetaB puntos { etiqueta a b } } }

# ---- Tablas de modelos (p. ej. rotación) y lo que no existe ----
query TablaModelo($clave: String!) { tablaModelo(clave: $clave) { clave concepto titulo unidad datosAl notas filas } }
query NoDisponible { datosNoDisponibles }

# ---- Transparencia: qué modelos hay detrás y qué tan buenos son ----
query EstadoPredicciones {
  estadoPredicciones {
    version datosAl limitaciones
    modelos { concepto nombre rol algoritmo metrica valor intervaloInf intervaloSup skill base notas }
  }
}

# ---- Editar una parcela guardada: nombre, cultivo y preferencias en UNA transacción (CONFLICTO_VERSION si cambió) ----
mutation ActualizarParcelaCompleta($id: ID!, $input: ActualizarParcelaInput!) {
  actualizarParcela(id: $id, input: $input) { id version nombre cultivoActual preferencias { sistemaRiego tipoSuelo } }
}

# ---- Otros cultivos que se podrían sembrar (rotación observada + precio esperado + cambio de familia) ----
query SugerenciasCultivo($parcelaId: ID!) {
  sugerenciasCultivo(parcelaId: $parcelaId) {
    cultivoBase origenBase metodo advertencias
    sugerencias { cultivo nombre puntaje probabilidadSiguientePct cambioPrecioPct unidadPrecio otraFamilia }
  }
}

# ---- Predicciones con datos frescos (olas de calor, lluvia, humedad); con escenario mueve c05b y c08a ----
query PrediccionesEnVivo($parcelaId: ID!, $escenario: EscenarioInput) {
  prediccionesEnVivo(parcelaId: $parcelaId, escenario: $escenario) {
    fuente datosAl antiguedadDias obsoleto sitio distanciaKm latenciaMs generadoEn advertencias
    resultados { concepto titulo unidad horizonte disponible valor serie datosAl rol algoritmo escenarioAplicado notas motivo fuente }
  }
}
