# Solo la base de datos para desarrollo local. devops-despliegue añade el backend y Caddy.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldshift}
      POSTGRES_DB: ${POSTGRES_DB:-fieldshift}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
